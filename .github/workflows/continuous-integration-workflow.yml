name: CI Workflow

on:
  push:
  pull_request:
    branches:
      - main
jobs:
  Check:
    timeout-minutes: 40
    continue-on-error: ${{ matrix.optional || false }}
    runs-on: ${{ matrix.os }}
    name: >-
      ${{ matrix.nox-session || matrix.task }}
      (${{ matrix.os }}, ${{ matrix.python-version }})
      ${{ matrix.optional && '[OPTIONAL]' }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
        nox-session: [test, example]

        include:

          - os: ubuntu-latest
            python-version: ''
            nox-session: ''
            task: shellcheck

          - os: ubuntu-latest
            python-version: '3.12'
            nox-session: flake8

          - os: ubuntu-latest
            python-version: '3.12'
            nox-session: pylint
            additional-sys-deps: libvirt-dev

          - os: ubuntu-latest
            python-version: '3.12'
            nox-session: mypy

          - os: ubuntu-latest
            python-version: '3.12'
            nox-session: docs

          - os: ubuntu-latest
            python-version: '3.12'
            nox-session: coverage

    env:
      NOXSESSION: ${{ matrix.nox-session }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
        if: matrix.python-version

      - name: Install system dependencies
        run: |
          sudo apt update
          if [ -n "${{ matrix.additional-sys-deps }}" ]; then
            sudo apt install ${{ matrix.additional-sys-deps }}
          fi
        if: startsWith(matrix.os, 'ubuntu') && matrix.additional-sys-deps

      - name: Install Nox
        # argcomplete 3.7.1 evaluates PEP 604 unions at import time on Python 3.9.
        run: python -m pip install nox toml "argcomplete!=3.7.1; python_version < '3.10'"
        if: matrix.nox-session

      - name: Run Nox
        run: nox -v
        if: matrix.nox-session

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        if: matrix.task == 'shellcheck'
